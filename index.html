<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعرض اليمني الافتراضي - الروبوت سام</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Three.js & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- MediaPipe Hands & Selfie Segmentation -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <!-- Standalone QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

    <style>
        :root {
            --gold: #f59e0b;
            --cyan: #00f3ff;
            --bg-dark: #030712;
            --glass-bg: rgba(3, 7, 18, 0.94);
            --glass-border: rgba(0, 243, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: #fff; width: 100vw; height: 100vh; overflow: hidden; position: relative; }

        video#webcam { display: none; }

        #visitor-canvas {
            position: absolute; bottom: 15px; left: 20px;
            width: 220px; height: 320px; z-index: 10;
            pointer-events: none; display: none;
            transform: scaleX(-1); object-fit: contain;
            background: transparent !important; border: none !important;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.7));
        }

        #robot-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 2;
            pointer-events: none; transition: opacity 0.8s ease;
        }

        #fullscreen-slideshow {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1;
            background-size: cover; background-position: center;
            opacity: 0; transform: scale(1);
            transition: opacity 0.6s ease-in-out, transform 4s ease-out;
        }

        #fullscreen-slideshow.active {
            opacity: 1; transform: scale(1.06);
        }

        #landmark-caption {
            position: absolute; bottom: 35px; left: 50%;
            transform: translateX(-50%); z-index: 9;
            font-size: 14px; font-weight: 700; color: #ffffff;
            text-shadow: 0 2px 6px #000, 0 0 12px rgba(0,0,0,0.9);
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; text-align: center; max-width: 80%;
            background: none !important;
        }

        #landmark-caption.show { opacity: 1; }

        #final-barcode-modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.85); z-index: 100;
            background: var(--glass-bg); border: 2px solid var(--gold);
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.4); border-radius: 25px;
            padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 15px;
            opacity: 0; pointer-events: none; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(20px); text-align: center; min-width: 320px;
        }

        #final-barcode-modal.show {
            opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1);
        }

        #qrcode-container {
            width: 190px; height: 190px; border-radius: 15px;
            border: 3px solid var(--cyan); background: #fff; padding: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        #qrcode-canvas { width: 100% !important; height: 100% !important; }

        #final-barcode-modal h2 { color: var(--gold); font-size: 18px; }
        #final-barcode-modal p { color: #ccc; font-size: 13px; }

        .btn-interactive {
            background: rgba(0, 243, 255, 0.2); border: 2px solid var(--cyan);
            color: #fff; padding: 10px 24px; border-radius: 15px; cursor: pointer; font-weight: 700;
            font-size: 15px; transition: all 0.3s ease; text-decoration: none; display: inline-block;
        }

        .btn-interactive.hovered, .btn-interactive:hover {
            background: var(--cyan) !important; color: #000 !important;
            box-shadow: 0 0 25px var(--cyan) !important; transform: scale(1.05);
        }

        #menu-zones {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            display: flex; gap: 20px; z-index: 20; padding: 25px;
            background: var(--glass-bg); border: 2px solid var(--glass-border);
            border-radius: 30px; backdrop-filter: blur(25px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.35); max-width: 95vw; overflow-x: auto;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; pointer-events: none;
        }
        
        #menu-zones.show { 
            transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto;
        }

        .province-card {
            min-width: 160px; height: 220px; border-radius: 20px;
            position: relative; overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2); cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 15px 10px;
        }

        .province-card .card-bg {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background-size: cover; background-position: center;
            transition: transform 0.6s ease; filter: brightness(0.65); z-index: 1;
        }

        .province-card .card-content { position: relative; z-index: 2; text-align: center; }
        .province-card span { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 3px 10px #000; }

        .province-card.hovered {
            transform: translateY(-12px) scale(1.06) !important;
            border-color: var(--cyan) !important;
            box-shadow: 0 12px 30px rgba(0, 243, 255, 0.5) !important;
        }
        .province-card.hovered .card-bg { transform: scale(1.2); filter: brightness(0.85); }

        #hand-pointer {
            position: absolute; width: 32px; height: 32px; border: 3px solid var(--cyan);
            border-radius: 50%; background: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 25px var(--cyan); transform: translate(-50%, -50%);
            z-index: 999; pointer-events: none; display: none;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-soft-piano-11382.mp3" type="audio/mpeg">
    </audio>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="visitor-canvas"></canvas>
    <div id="hand-pointer"></div>
    <div id="fullscreen-slideshow"></div>
    <div id="landmark-caption"></div>

    <div id="final-barcode-modal">
        <h2>امسح الباركود بهاتفك لعرض تفاصيل جولتك</h2>
        <div id="qrcode-container">
            <canvas id="qrcode-canvas"></canvas>
        </div>
        <p>استمتع بتصفح جولتك التفاعلية الخاصة في أي وقت.</p>
        <div>
            <button id="close-barcode-btn" class="btn-interactive" onclick="resetToMenu()">
                الزائر التالي (<span id="countdown">20</span>ث)
            </button>
        </div>
    </div>

    <div id="robot-container"></div>

    <div id="menu-zones">
        <div class="province-card" data-id="sanaa">

        </div>
        <div class="province-card" data-id="hadramout">

        </div>
        <div class="province-card" data-id="taiz">

        </div>
        <div class="province-card" data-id="hudaydah">

        <div class="province-card" data-id="ibb">

    <script>

            { id: "dar_hajar", name: "دار الحجر", img: "images/sanaa/dar_hajar.jpg", text: "وننتقل إلى دار الحجر بـ وادي ظهر، التحفة المعمارية الشامخة على قمة الصخرة." },
            { id: "grand_mosque", name: "مئذنة الجامع الكبير", img: "images/sanaa/grand_mosque.jpg", text: "مئذنة الجامع الكبير بصنعاء، أحد أول وأعرق المساجد في الإسلام." },
            { id: "souk_milh", name: "سوق الملح", img: "images/sanaa/souk_milh.jpg", text: "وهنا سوق الملح التراثي، حيث الأزياء اليمنية، العقيق، والحرف اليدوية الأصيلة." },
            { id: "heritage_house", name: "بيت التراث الصنعاني", img: "images/sanaa/heritage_house.jpg", text: "بيت التراث الصنعاني، يجسد روعة الفن المعماري والنوافذ القمرية الملونة." },
            { id: "al_qaa", name: "الحي اليهودي (القاع)", img: "images/sanaa/al_qaa.jpg", text: "حي القاع التاريخي والمعروف بطرازه المعماري الفريد." },
            { id: "silah_palace", name: "قصر السلاح", img: "images/sanaa/silah_palace.jpg", text: "قصر السلاح التاريخي المشرف على حارة صنعاء القديمة." },
            { id: "folk_museum", name: "متحف التراث الشعبي", img: "images/sanaa/folk_museum.jpg", text: "متحف التراث الشعبي الذي يعرض أدوات الحياة اليومية والحلي والجنبيات اليمنية القديمة." },
            { id: "sabeen_square", name: "ميدان السبعين", img: "images/sanaa/sabeen_square.jpg", text: "ميدان السبعين، أحد أبرز الميادين والمعالم الحديثة في العاصمة صنعاء." }
        ];

        const hadramoutLandmarks = [
            { id: "shibam", name: "مدينة شبام حضرموت", img: "images/hadramout/shibam.jpg", text: "مدينة شبام التاريخية، أقدم نطاحات سحاب طينية في العالم والملقبة بـ مانهاتن الصحراء." },
            { id: "doan_palaces", name: "قصور وادي دوعن", img: "images/hadramout/doan_palaces.jpg", text: "قصور وادي دوعن الطينية الشهيرة بتصميمها الهندسي والجمالي الفريد." },
            { id: "tarim", name: "تريم التاريخية", img: "images/hadramout/tarim.jpg", text: "مدينة تريم، عاصمة الثقافة الإسلامية ومركز العلم والمآذن الطينية الشاهقة." },

            { id: "hadramout_valley", name: "وادي حضرموت", img: "images/hadramout/hadramout_valley.jpg", text: "المناظر الطبيعية الخلابة والنخيل المنتشر في أرجاء وادي حضرموت." },
            { id: "artifacts", name: "معالم وأثريات حضرموت", img: "images/hadramout/artifacts.jpg", text: "النقوش والآثار التاريخية التي تعكس حضارة حضرموت القديمة." }

        const taizLandmarks = [

            { id: "bab_al_kabir", name: "باب الكبير", img: "images/taiz/bab_al_kabir.jpg", text: "الباب الكبير، المدخل التاريخي الأبرز لمدينة تعز القديمة." },
            { id: "jabal_sabir", name: "إطلالة جبل صبر", img: "images/taiz/jabal_sabir.jpg", text: "مشهد بانورامي ساحر لمدينة تعز من أعالي قمم جبل صبر الشاهق." },
            { id: "bab_musa", name: "باب موسى", img: "images/taiz/bab_musa.jpg", text: "باب موسى، أحد أبواب تعز القديمة التاريخية والعريقة." },
            { id: "taiz_souk", name: "سوق تعز التراثي", img: "images/taiz/taiz_souk.jpg", text: "سوق تعز التراثي، زواريب المدينة القديمة والأسواق الشعبية المليئة بالحياة." }
        ];

        const hudaydahLandmarks = [
            { id: "bab_mushrif", name: "باب المشرف", img: "images/hudaydah/bab_mushrif.jpg", text: "باب المشرف التاريخي، أحد أشهر الأبواب العريقة للمدينة القديمة في الحديدة." },

            { id: "hudaydah_corniche", name: "كورنيش الحديدة", img: "images/hudaydah/hudaydah_corniche.jpg", text: "كورنيش الحديدة ومتنزهاتها البحرية الساحرة للزوار والأهالي." },
            { id: "fish_market", name: "سوق السمك (الميناء السمكي)", img: "images/hudaydah/fish_market.jpg", text: "سوق السمك والميناء السمكي، مركز الثروة البحرية والأسماك الطازجة بالحديدة." }
        ];

        const ibbLandmarks = [
            { id: "banna_waterfalls", name: "شلالات وادي بنا", img: "images/ibb/banna_waterfalls.jpg", text: "شلالات وادي بنا ومنطقة السحول الخضراء، من أجمل المناظر الطبيعية في اللواء الأخضر." },

            { id: "jiblah_mosque", name: "مسجد جبلة التاريخي", img: "images/ibb/jiblah_mosque.jpg", text: "جامع السيدة أروى بنت أحمد الصليحي في مدينة جبلة التاريخية وعاصمتها العريقة." },

        const canvasCtx = visitorCanvas.getContext('2d');

        const robotContainer = document.getElementById('robot-container');
        const menuZones = document.getElementById('menu-zones');
        const slideshow = document.getElementById('fullscreen-slideshow');
        const landmarkCaption = document.getElementById('landmark-caption');
        const finalBarcodeModal = document.getElementById('final-barcode-modal');
        const closeBarcodeBtn = document.getElementById('close-barcode-btn');
        const countdownEl = document.getElementById('countdown');
        const bgMusic = document.getElementById('bg-music');

        let currentProvince = null;
        let lastPointerX = window.innerWidth / 2;
        let lastPointerY = window.innerHeight / 2;
        let slideshowTimeout = null;
        let hideCaptionTimeout = null;
        let autoCloseInterval = null;
        let hasGreetedVisitor = false;

        // Three.js Scene Setup
        const robotScene = new THREE.Scene();
        const robotCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const robotRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        robotRenderer.setSize(window.innerWidth, window.innerHeight);
        robotContainer.appendChild(robotRenderer.domElement);

        robotScene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const pLight = new THREE.PointLight(0x00f3ff, 4, 20); pLight.position.set(3, 5, 5); robotScene.add(pLight);

        const loader = new THREE.GLTFLoader();
        let samRobot = null;
        let mixer = null;
        const clock = new THREE.Clock();

        // تحميل ملف scene.gltf الخاص بالروبوت
        loader.load('scene.gltf', function (gltf) {
            samRobot = gltf.scene;
            samRobot.scale.set(1.6, 1.6, 1.6);
            samRobot.position.set(0, -1.2, 0);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(samRobot);
                mixer.clipAction(gltf.animations[0]).play();
            }
            robotScene.add(samRobot);
        }, undefined, function (error) {
            console.error('Error loading scene.gltf:', error);
        });

        robotCamera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            if (samRobot) {
                samRobot.position.y = -1.2 + Math.sin(Date.now() * 0.002) * 0.08;
                const targetRotY = ((lastPointerX / window.innerWidth) - 0.5) * 0.8;
                samRobot.rotation.y += (targetRotY - samRobot.rotation.y) * 0.05;
            }
            robotRenderer.render(robotScene, robotCamera);
        }
        animate();

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 1.0;
                if (callback) utterance.onend = callback;
                window.speechSynthesis.speak(utterance);
            } else if (callback) callback();
        }

        const selfieSegmentation = new SelfieSegmentation({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}` });
        selfieSegmentation.setOptions({ modelSelection: 1 });

        selfieSegmentation.onResults((results) => {
            if (currentProvince === null) return;
            visitorCanvas.width = results.image.width;
            visitorCanvas.height = results.image.height;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, visitorCanvas.width, visitorCanvas.height);
            canvasCtx.drawImage(results.segmentationMask, 0, 0, visitorCanvas.width, visitorCanvas.height);
            canvasCtx.globalCompositeOperation = 'source-in';
            canvasCtx.drawImage(results.image, 0, 0, visitorCanvas.width, visitorCanvas.height);
            canvasCtx.restore();
        });

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handPointer.style.display = 'block';
                const hand = results.multiHandLandmarks[0];
                const rawX = (1 - hand[8].x) * window.innerWidth;
                const rawY = hand[8].y * window.innerHeight;
                lastPointerX += (rawX - lastPointerX) * 0.5;
                lastPointerY += (rawY - lastPointerY) * 0.5;
                handPointer.style.left = `${lastPointerX}px`;
                handPointer.style.top = `${lastPointerY}px`;
                
                if (!hasGreetedVisitor && currentProvince === null) {
                    hasGreetedVisitor = true;
                    speak("أهلاً بك! أنا سام، دليلك الذكي. اختر وجهتك الآن بيدك.", () => {
                        menuZones.classList.add('show');
                    });
                }
                checkCollisions(lastPointerX, lastPointerY);
            } else {
                handPointer.style.display = 'none';
            }
        });

        let currentHoveredElement = null;
        let hoverTimer = null;

        function checkCollisions(x, y) {
            if (finalBarcodeModal.classList.contains('show')) {
                const btnRect = closeBarcodeBtn.getBoundingClientRect();
                if (x >= btnRect.left && x <= btnRect.right && y >= btnRect.top && y <= btnRect.bottom) {
                    if (!closeBarcodeBtn.classList.contains('hovered')) {
                        closeBarcodeBtn.classList.add('hovered');
                        hoverTimer = setTimeout(() => { resetToMenu(); }, 1000);
                    }
                } else {
                    closeBarcodeBtn.classList.remove('hovered');
                    if (hoverTimer) clearTimeout(hoverTimer);
                }
                return;
            }

            if (currentProvince !== null || !menuZones.classList.contains('show')) return;

            const cards = document.querySelectorAll('.province-card');
            let found = false;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    found = true;
                    if (currentHoveredElement !== card) {
                        clearHover();
                        currentHoveredElement = card;
                        card.classList.add('hovered');

                        hoverTimer = setTimeout(() => {
                            selectProvince(card.getAttribute('data-id'));
                            clearHover();
                        }, 1000);
                    }
                }
            });
            if (!found) clearHover();
        }

        function clearHover() {
            if (hoverTimer) clearTimeout(hoverTimer);
            document.querySelectorAll('.province-card, .btn-interactive').forEach(c => c.classList.remove('hovered'));
            currentHoveredElement = null;
        }

        function selectProvince(id) {
            currentProvince = id;
            menuZones.classList.remove('show');
            robotContainer.style.opacity = '0';
            try { bgMusic.play(); } catch(e){}

            visitorCanvas.style.display = 'block';
            startShowcaseAllImages(id);
        }

        function startShowcaseAllImages(provinceId) {
            const items = landmarksData[provinceId] || [];
            if (items.length === 0) return;

            let index = 0;

            function displayItem() {
                if (index >= items.length) {
                    finishTourAndShowBarcode();
                    return;
                }

                const currentItem = items[index];
                slideshow.classList.remove('active');
                landmarkCaption.classList.remove('show');
                
                setTimeout(() => {
                    slideshow.style.backgroundImage = `url('${currentItem.img}')`;
                    slideshow.classList.add('active');

                    landmarkCaption.innerText = currentItem.text;
                    landmarkCaption.classList.add('show');

                    if (hideCaptionTimeout) clearTimeout(hideCaptionTimeout);
                    hideCaptionTimeout = setTimeout(() => {
                        landmarkCaption.classList.remove('show');
                    }, 1500);

                }, 100);

                index++;
                
                slideshowTimeout = setTimeout(() => {
                    displayItem();
                }, 4000); 
            }

            displayItem();
        }

        function generateQRCode() {
            try {
                const currentUrl = window.location.href.split('?')[0] + `?city=${currentProvince}`;
                new QRious({
                    element: document.getElementById('qrcode-canvas'),
                    value: currentUrl,
                    size: 180,
                    level: 'H'
                });
            } catch (e) {
                console.error("QR Generation Error:", e);
            }
        }

        function finishTourAndShowBarcode() {
            try { bgMusic.pause(); bgMusic.currentTime = 0; } catch(e){}

            generateQRCode();

            finalBarcodeModal.classList.add('show');
            visitorCanvas.style.display = 'none';

            let timeLeft = 20;
            countdownEl.innerText = timeLeft;

            if (autoCloseInterval) clearInterval(autoCloseInterval);
            autoCloseInterval = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(autoCloseInterval);
                    resetToMenu();
                }
            }, 1000);
        }

        function resetToMenu() {
            if (slideshowTimeout) clearTimeout(slideshowTimeout);
            if (hideCaptionTimeout) clearTimeout(hideCaptionTimeout);
            if (autoCloseInterval) clearInterval(autoCloseInterval);

            try { bgMusic.pause(); bgMusic.currentTime = 0; } catch(e){}

            currentProvince = null;
            hasGreetedVisitor = false;
            
            slideshow.classList.remove('active');
            landmarkCaption.classList.remove('show');
            finalBarcodeModal.classList.remove('show');
            
            visitorCanvas.style.display = 'none';
            robotContainer.style.opacity = '1';

            menuZones.classList.remove('show');
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => { 
                await hands.send({ image: videoElement });
                if (currentProvince !== null) {
                    await selfieSegmentation.send({ image: videoElement });
                }
            },
            width: 1280, height: 720
        });

        window.addEventListener('load', () => {
            camera.start();
        });
    </script>
</body>
</html>
